name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restaurar dependencias
        run: dotnet restore backend/AgroStock.Api.Tests/AgroStock.Api.Tests.csproj

      - name: Compilar
        run: dotnet build backend/AgroStock.Api.Tests/AgroStock.Api.Tests.csproj --no-restore --configuration Release

      - name: Ejecutar pruebas
        run: dotnet test backend/AgroStock.Api.Tests/AgroStock.Api.Tests.csproj --no-build --configuration Release --verbosity normal
